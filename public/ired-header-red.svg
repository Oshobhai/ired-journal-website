    <rect x="39" y="58" width="14" height="65" rx="2" class="red"/>
    <text x="61" y="123" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="-5" class="red">Red</text>
  </g>

  <line x1="286" y1="28" x2="286" y2="126" stroke="#d4dde4" stroke-width="2"/>

  <!-- institutional lockup -->
  <text x="315" y="59" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" class="navy">Institute of Research Education</text>
  <text x="315" y="91" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" class="navy">and Development</text>
  <text x="316" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2" class="red">KNOWLEDGE FOR A BETTER TOMORROW</text>
  <text x="316" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13.5" class="muted">Research · Education · Academic Development</text>
