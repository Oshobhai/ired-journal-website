<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" role="img" aria-labelledby="title desc">
  <title id="title">IRed — Institute of Research Education and Development</title>
  <desc id="desc">IRed sunburst wordmark with the full Institute of Research Education and Development name and motto for the website header.</desc>
  <defs>
    <style>
      .red{fill:#e51b23}.navy{fill:#123454}.muted{fill:#536779}
    </style>
  </defs>

  <!-- IRed mark -->
  <g transform="translate(8 6)">
    <g transform="translate(46 35)" class="red">
      <circle cx="0" cy="0" r="13"/>
      <g fill="none" stroke="#e51b23" stroke-width="4.8" stroke-linecap="round">
        <path d="M0-21 C-4-27 -4-33 0-40"/>
        <path d="M0 21 C4 27 4 33 0 40"/>
        <path d="M-21 0 C-27-4 -33-4 -40 0"/>
        <path d="M21 0 C27 4 33 4 40 0"/>
        <path d="M-15-15 C-22-17 -27-22 -29-29"/>
        <path d="M15 15 C22 17 27 22 29 29"/>
        <path d="M15-15 C17-22 22-27 29-29"/>
        <path d="M-15 15 C-17 22 -22 27 -29 29"/>
        <path d="M-8-20 C-10-27 -8-33 -4-39"/>
        <path d="M8-20 C10-27 8-33 4-39"/>
        <path d="M-8 20 C-10 27 -8 33 -4 39"/>
        <path d="M8 20 C10 27 8 33 4 39"/>
        <path d="M-20-8 C-27-10 -33-8 -39-4"/>
        <path d="M-20 8 C-27 10 -33 8 -39 4"/>
        <path d="M20-8 C27-10 33-8 39-4"/>
        <path d="M20 8 C27 10 33 8 39 4"/>
